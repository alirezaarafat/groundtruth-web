<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create an account — GroundTruth</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="wordmark"><span class="dot"></span>GroundTruth</a>
    <div class="nav-links">
      <a href="login.html">Already have an account? Log in</a>
    </div>
  </div>
</nav>

<main class="auth-shell">
  <div class="auth-card">
    <h1>Create an account</h1>
    <p class="lede">You'll be able to file a report in about a minute.</p>

    <div id="register-msg" class="form-msg"></div>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" />
        <small>Optional — only used if an authority needs to follow up.</small>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
        <small>At least 8 characters.</small>
      </div>
      <button type="submit" class="btn btn-primary btn-wide">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
